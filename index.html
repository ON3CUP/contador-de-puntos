<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@900&display=swap');
        
        body { background: transparent; margin: 0; padding: 20px; overflow: hidden; font-family: 'Oswald', sans-serif; }
        
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
        }

        .container { text-align: center; }
        
        /* Contenedores para las imágenes laterales */
        .header-row, .counter-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; /* Espacio entre imagen y texto */
        }

        /* Estilo general para las 4 imágenes decorativas */
        .decor-img {
            width: 40px;  /* Ajusta el tamaño según necesites */
            height: 40px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }

        .title { 
            font-size: 35px; color: #ef4444; -webkit-text-stroke: 1.2px white; 
            text-transform: uppercase; letter-spacing: 2px;
            margin: 0;
        }
        
        .numbers { 
            font-size: 55px; color: #a855f7; -webkit-text-stroke: 1.2px white; 
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
            margin: 0;
        }

        #notification-container {
            margin-top: 10px; width: 100%; display: flex; 
            flex-direction: column; align-items: center; min-height: 80px;
        }

        /* --- ESTILOS DE NOTIFICACIÓN --- */
        .toast {
            background: rgba(0, 0, 0, 0.9); border-bottom: 3px solid #10b981;
            color: white; padding: 10px 20px; border-radius: 4px;
            font-family: 'Inter', sans-serif; display: flex; gap: 15px;
            align-items: center; animation: fadeInDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333;
        }
        .toast.negative { border-bottom-color: #ef4444; }
        .killer-icon { width: 45px; height: 45px; object-fit: contain; filter: drop-shadow(0 0 5px #ef4444); }
        .toast .points { font-size: 24px; font-weight: 900; color: #fff; }
        .toast .desc { font-size: 11px; text-transform: uppercase; color: #aaa; letter-spacing: 0.5px; max-width: 180px; line-height: 1.1; }

        @keyframes fadeInDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { transform: translateY(10px); opacity: 0; } }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="container">
            <div class="header-row">
                <img src="imag/decor-punto.png" class="decor-img">
                <div class="title">PUNTOS</div>
                <img src="imag/decor-punto.png" class="decor-img">
            </div>

            <div class="counter-row">
                <img src="imag/decor-contador.png" class="decor-img">
                <div class="numbers"><span id="actual">0</span> / <span id="total">0</span></div>
                <img src="imag/decor-contador.png" class="decor-img">
            </div>
        </div>
        <div id="notification-container"></div>
    </div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBS7uwcZNsSOMtfwIJzewDeACX22fWeaBY",
        authDomain: "dbd-overlay.firebaseapp.com",
        projectId: "dbd-overlay",
        databaseURL: "https://dbd-overlay-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const alertSound = new Audio('sonido.mp3'); 

    const killerImages = {
        "Trampero": "imag/trampero.png", "Canibal": "imag/canibal.png", "Onryo": "imag/onryo.png",
        "Legion": "imag/legion.png", "Cerda": "imag/cerda.png", "Nemesis": "imag/nemesis.png",
        "Draga": "imag/draga.png", "Pesadilla": "imag/pesadilla.png", "Cazadora": "imag/cazadora.png",
        "Verdugo": "imag/verdugo.png", "Animatrónico": "imag/animatronico.png", "Pueblerino": "imag/pueblerino.png",
        "Espíritu": "imag/espiritu.png", "Cenobita": "imag/cenobita.png", "Artista": "imag/artista.png",
        "GhostFace": "imag/ghostface.png", "Cerebro": "imag/cerebro.png", "Caballero": "imag/caballero.png",
        "Oni": "imag/oni.png", "Plaga": "imag/plaga.png", "Payaso": "imag/payaso.png",
        "Enfermera": "imag/enfermera.png", "Singularidad": "imag/singularidad.png", "Comerciante": "imag/comerciante.png",
        "Mellizos": "imag/mellizos.png", "Embaucador": "imag/embaucador.png", "Xenomorfo": "imag/xenomorfo.png",
        "Desconocido": "imag/desconocido.png", "Liche": "imag/liche.png", "Señor Oscuro": "imag/senor-oscuro.png",
        "Adiestradora": "imag/adiestradora.png", "Krasue": "imag/krasue.png", "El Primero": "imag/el-primero.png",
        "Arponero": "imag/arponero.png", "La Forma": "imag/la-forma.png", "Good Guy": "imag/good-guy.png",
        "Demogorgon": "imag/demogorgon.png", "El Ghoul": "imag/el-ghoul.png", "Espectro": "imag/espectro.png",
        "Doctor": "imag/doctor.png", "Bruja": "imag/bruja.png", "Deterioro": "imag/deterioro.png"
    };

    db.ref('goal_data').on('value', (s) => {
        const d = s.val();
        if (d) {
            document.getElementById('actual').innerText = (d.actual || 0).toLocaleString();
            document.getElementById('total').innerText = (d.meta || 0).toLocaleString();
        }
    });

    let initialLoad = true;
    db.ref('goal_history').limitToLast(1).on('child_added', (snapshot) => {
        if (initialLoad) {
            setTimeout(() => { initialLoad = false; }, 2000);
            return;
        }
        const data = snapshot.val();
        showNotification(data.desc, data.pts);
    });

    function showNotification(desc, pts) {
        const container = document.getElementById('notification-container');
        container.innerHTML = ""; 
        alertSound.currentTime = 0;
        alertSound.play().catch(e => console.warn("Interactúa con OBS para el audio."));

        const toast = document.createElement('div');
        const isNeg = pts < 0;
        let killerImgHtml = "";
        if (desc.includes(':')) {
            const nombreKiller = desc.split(':')[0].trim();
            const imgFile = killerImages[nombreKiller];
            if (imgFile) { killerImgHtml = `<img src="${imgFile}" class="killer-icon">`; }
        }

        const displayDesc = desc === "Manual" ? "PARTIDA" : desc;
        toast.className = `toast ${isNeg ? 'negative' : ''}`;
        toast.innerHTML = `
            ${killerImgHtml}
            <span class="points">${isNeg ? '' : '+'}${pts.toLocaleString()}</span>
            <span class="desc">${displayDesc}</span>
        `;

        container.appendChild(toast);
        setTimeout(() => {
            toast.style.animation = "fadeOut 0.5s forwards";
            setTimeout(() => toast.remove(), 500);
        }, 4000);
    }
</script>
</body>
</html>
